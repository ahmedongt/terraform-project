name: "Terraform CI/CD"

on:
  push:
    branches:
      - master
      - main
      - feature/docker-migration
  pull_request:
    branches:
      - master
      - main

jobs:
  terraform:
    name: "Terraform & Ansible Deploy"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flask flask-cors requests werkzeug
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi

      - name: Run Tests with Coverage
        run: |
          touch api/__init__.py
          export PYTHONPATH=$PYTHONPATH:$(pwd)/api
          # Force the report to be written to the root directory
          python -m pytest --cov=api --cov-report=xml:coverage.xml api/
          # Debug: List files to ensure coverage.xml exists
          ls -l coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          project-prop: |
            sonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            sonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            sonar.python.coverage.reportPaths=coverage.xml
            sonar.sources=api
            sonar.tests=api
            sonar.test.inclusions=api/test_*.py
            sonar.coverage.exclusions=api/test_*.py,website/**/*,ansible/**/*,*.tf,*.yml,*.md,**/__init__.py

      # Rest of your AWS/Terraform/Ansible steps remain exactly the same...
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=kali-terraform-state-storage-2026" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan 
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: terraform apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"

      - name: Get Server IP
        id: get_ip
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name : 'push'
        run: |
          echo "SERVER_IP=$(terraform output -raw server_ip)" >> $GITHUB_OUTPUT

      - name: Setup SSH Agent
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Run Ansible Playbook
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          ansible-galaxy collection install community.docker
          ansible-playbook -i "${{ steps.get_ip.outputs.SERVER_IP }}," ansible/deploy.yml \
            -e "ansible_user=ec2-user"