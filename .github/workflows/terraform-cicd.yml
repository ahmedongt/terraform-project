name: "Terraform CI/CD"

on:
  push:
    branches:
      - master
      - main
      - feature/docker-migration
      - feature/aws-ssm-migration
      - feature/automate-ecr-builds
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/terraform-destroy.yml'
  pull_request:
    branches:
      - master
      - main

jobs:
  packer:
    name: "Packer Image Baking"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      packer_ran: ${{ steps.check_changes.outputs.PACKER_RAN }}
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Core Blueprint System Modifications
        id: check_changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "ami-blueprint.pkr.hcl"; then
            echo "PACKER_RAN=true" >> $GITHUB_OUTPUT
            echo "AMI system change detected. Proceeding with active image baking track."
          else
            echo "PACKER_RAN=false" >> $GITHUB_OUTPUT
            echo "No image modifications found. Short-circuiting execution to speed track."
          fi

      - name: Configure AWS Credentials
        if: steps.check_changes.outputs.PACKER_RAN == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      - name: Setup Packer Engine
        if: steps.check_changes.outputs.PACKER_RAN == 'true'
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Initialize Packer Dependencies
        if: steps.check_changes.outputs.PACKER_RAN == 'true'
        run: packer init ami-blueprint.pkr.hcl

      - name: Bake Golden DevOps Base Image
        if: steps.check_changes.outputs.PACKER_RAN == 'true'
        run: packer build -color=false -on-error=cleanup ami-blueprint.pkr.hcl

  terraform:
    name: "Terraform Infrastructure Deploy"
    runs-on: ubuntu-latest
    needs: packer
    timeout-minutes: 15
    if: |
      always() && 
      (needs.packer.result == 'success' || needs.packer.result == 'skipped') && 
      (github.event_name == 'push' || github.event_name == 'pull_request')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flask flask-cors requests werkzeug
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi

      - name: Run Tests with Coverage
        run: |
          touch api/__init__.py
          export PYTHONPATH=$PYTHONPATH:$(pwd)/api
          python -m pytest --cov=api --cov-report=xml:coverage.xml api/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      - name: Package and Publish App Configurations to S3
        if: github.event_name == 'push'
        run: |
          echo "=== Archiving deployment descriptors ==="
          tar -czf app-payload.tar.gz docker-compose.yml default.conf prometheus.yml website/ grafana/          
          echo "=== Shipping secure payload bundle to configuration staging bucket ==="
          aws s3 cp app-payload.tar.gz s3://monitoring-configs-and-stats-kali/deployments/app-payload.tar.gz

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=kali-terraform-state-storage-2026" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_grafana_admin_user: ${{ secrets.GRAFANA_ADMIN_USER }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"
        run: |
          terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_grafana_admin_user: ${{ secrets.GRAFANA_ADMIN_USER }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"
        run: |
          terraform apply -auto-approve

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image to Amazon ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devops-backend
          IMAGE_TAG: latest
        run: |
          echo "Building Python Application Container..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./api
          echo "Pushing Immutable Artifact to Private AWS ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG