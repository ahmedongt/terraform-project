name: "Terraform CI/CD"

on:
  push:
    branches:
      - master
      - main
      - feature/docker-migration
  pull_request:
    branches:
      - master
      - main

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. AUTHENTICATE WITH AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      # 2. SETUP TERRAFORM
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

      # 3. INITIALIZE
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=kali-terraform-state-storage-2026" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan 
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"

      # 4. APPLY CHANGES
      - name: Terraform Apply
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: terraform apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"

      # 5. CAPTURE SERVER IP
      - name: Get Server IP
        id: get_ip
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: |
          echo "SERVER_IP=$(terraform output -raw server_ip)" >> $GITHUB_OUTPUT

      # 6. SYNC PROJECT TO S3 (Exclude clutter to keep EC2 clean)
      - name: Sync Project to S3
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: |
          aws s3 sync . s3://kali-web-lab-kali-12345/ \
            --exclude ".git/*" \
            --exclude ".terraform/*" \
            --exclude ".github/*" \
            --exclude "*.tf*" \
            --exclude "*.ps1" \
            --exclude "Extra file .txt" \
            --exclude "verify*" \
            --exclude "check_state.json"

      # 7. REMOTE SSH DEPLOY
      - name: Deploy to EC2 via SSH
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.get_ip.outputs.SERVER_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Ensure Docker is installed and running
            sudo dnf install -y docker
            sudo systemctl enable --now docker
            sudo usermod -aG docker ec2-user

            # 2. Install Docker Compose as a GLOBAL Plugin
            echo "Installing Docker Compose..."
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            sudo ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/bin/docker-compose

            # 3. Sync web files from S3
            sudo aws s3 sync s3://kali-web-lab-kali-12345/ /var/www/html/ --delete
            cd /var/www/html/

            # 4. Deploy with Forced Cleanup
            echo "Starting containers..."
            # --remove-orphans handles containers defined in old versions of the yaml
            sudo docker compose down --remove-orphans || true
            
            # Explicitly kill the backend container if it's stuck
            sudo docker rm -f backend || true
            
            # Final build and launch
            sudo docker compose up -d --build