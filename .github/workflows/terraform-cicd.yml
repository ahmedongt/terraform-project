name: "Terraform CI/CD"

on:
  push:
    branches:
      - master
      - main
      - feature/docker-migration
      - feature/aws-ssm-migration
    # SMARTEST PATH ROUTING: Ensures background steps evaluate code spaces selectively
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main

jobs:
  packer:
    name: "Packer Image Baking"
    runs-on: ubuntu-latest
    # SPEED OPTIMIZATION: Only boot the heavy 6-minute engine if the core system blueprints actually change!
    outputs:
      packer_ran: ${{ steps.check_changes.outputs.PACKER_RAN }}
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches current and previous commit to accurately trace file diff mechanics

      - name: Check for Core Blueprint System Modifications
        id: check_changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "ami-blueprint.pkr.hcl"; then
            echo "PACKER_RAN=true" >> $GITHUB_OUTPUT
            echo "AMI system change detected. Proceeding with active image baking track."
          else
            echo "PACKER_RAN=false" >> $GITHUB_OUTPUT
            echo "No image modifications found. Short-circuiting execution to speed track."
          fi

      - name: Configure AWS Credentials
        if: steps.check_changes.outputs.PACKER_RAN == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      - name: Setup Packer Engine
        if: steps.check_changes.outputs.PACKER_RAN == 'true'
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Initialize Packer Dependencies
        if: steps.check_changes.outputs.PACKER_RAN == 'true'
        run: packer init ami-blueprint.pkr.hcl

      - name: Bake Golden DevOps Base Image
        if: steps.check_changes.outputs.PACKER_RAN == 'true'
        run: packer build -color=false -on-error=cleanup ami-blueprint.pkr.hcl

  terraform:
    name: "Terraform Infrastructure Deploy"
    runs-on: ubuntu-latest
    needs: packer
    # THE SECRET SAUCE: Allows execution to proceed whether Packer ran successfully or was skipped entirely
    if: |
      always() && 
      (needs.packer.result == 'success' || needs.packer.result == 'skipped') && 
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
      # 1. CHECKOUT CODE
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. SETUP PYTHON & RUN TESTS
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flask flask-cors requests werkzeug
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi

      - name: Run Tests with Coverage
        run: |
          touch api/__init__.py
          export PYTHONPATH=$PYTHONPATH:$(pwd)/api
          python -m pytest --cov=api --cov-report=xml:coverage.xml api/
        continue-on-error: true

      # 3. SONARCLOUD SCAN
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ""

      # 4. AUTHENTICATE WITH AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      # 5. SETUP TERRAFORM ENGINE
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

      # 6. INITIALIZE & PLAN STAGES
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=kali-terraform-state-storage-2026" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan 
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"

      # 7. APPLY INFRASTRUCTURE CONFIGURATIONS (Only executes on verified target production push tracking)
      - name: Terraform Apply
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: terraform apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"