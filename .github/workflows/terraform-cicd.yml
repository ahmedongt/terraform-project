name: "Terraform CI/CD"

on:
  push:
    branches:
      - master
      - main
      - feature/docker-migration
  pull_request:
    branches:
      - master
      - main

jobs:
  terraform:
    name: "Terraform & Ansible Deploy"
    runs-on: ubuntu-latest
    
    steps:
      # 1. CHECKOUT CODE (With full history for SonarCloud)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. SONARCLOUD SCAN (The Quality Gate)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 3. AUTHENTICATE WITH AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      # 4. SETUP TERRAFORM
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

      # 5. INITIALIZE
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=kali-terraform-state-storage-2026" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan 
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"

      # 6. APPLY CHANGES
      - name: Terraform Apply
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: terraform apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain_name: "ytthumbnail.site"
          TF_VAR_subdomain_name: "www"
          TF_VAR_user_name: "kali"
          TF_VAR_instance_type: "t3.micro"

      # 7. CAPTURE SERVER IP
      - name: Get Server IP
        id: get_ip
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: |
          echo "SERVER_IP=$(terraform output -raw server_ip)" >> $GITHUB_OUTPUT

      # 8. SETUP SSH AGENT (For Ansible)
      - name: Setup SSH Agent
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 9. RUN ANSIBLE DEPLOYMENT
      - name: Run Ansible Playbook
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          # Install the docker community collection
          ansible-galaxy collection install community.docker
          
          # Run the playbook using the IP captured in Step 7
          ansible-playbook -i "${{ steps.get_ip.outputs.SERVER_IP }}," ansible/deploy.yml \
            -e "ansible_user=ec2-user"