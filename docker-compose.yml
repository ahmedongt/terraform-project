version: '3.8'

services:
  frontend:
    image: nginx:alpine
    container_name: terraform-project-frontend
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./website:/usr/share/nginx/html
    restart: always
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-python:3.9-slim}
    container_name: terraform-project-backend
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./api:/app
    working_dir: /app
    command: gunicorn --bind 0.0.0.0:5000 app:app
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: terraform-project-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: terraform-project-grafana-1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: always
    depends_on:
      - prometheus