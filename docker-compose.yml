services:
  # Python API (Backend)
  backend:
    build: ./api
    container_name: backend
    restart: always
    expose:
      - "5000"

  # Nginx Web Server (Frontend)
  frontend:
    image: nginx:alpine
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro

  # Prometheus (The Brain)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    # We closed these in the AWS Security Group, but keeping them here 
    # for the SSH Tunnel to work locally on your ThinkPad.
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus  # Mapped to local project folder
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - backend

  # Grafana (The Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin 
    volumes:
      - ./data/grafana:/var/lib/grafana  # Mapped to local project folder
    depends_on:
      - prometheus