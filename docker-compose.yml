services:
  # Python API (Backend)
  backend:
    build: ./api
    container_name: backend
    restart: always
    expose:
      - "5000"

  # Nginx Web Server (Frontend)
  frontend:
    image: nginx:alpine
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro

  # Prometheus (The Brain - Metrics Collector)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_stats_volume:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d' # AWS auto-purges after 15 days
    depends_on:
      - backend

  # Grafana (The Dashboard - Visuals)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # You can change 'admin' to your own password
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

# Persistent Volumes on AWS
volumes:
  prometheus_stats_volume:
    name: prometheus_stats_volume # Hardcoded name so our backup script never misses it
  grafana_data: