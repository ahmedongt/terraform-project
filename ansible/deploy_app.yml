---
- name: Setup YouTube Thumbnail Downloader
  hosts: all
  become: yes
  tasks:
    - name: Update all OS packages
      dnf:
        name: "*"
        state: latest

    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Deploy Placeholder App Page
      copy:
        content: |
          <html>
            <body style="background: #222; color: #fff; text-align: center; font-family: sans-serif;">
              <h1>YouTube Thumbnail Downloader</h1>
              <input type="text" placeholder="Paste YT URL here...">
              <button>Get Thumbnail</button>
              <p>Status: Ready (Deployed via Ansible)</p>
            </body>
          </html>
        dest: /usr/share/nginx/html/index.html
