---
- name: Deploy YT Thumbnail App
  hosts: all
  become: yes
  tasks:
    - name: Ensure project directory exists on EC2
      file:
        path: /home/ec2-user/terraform-project
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Copy project files to EC2
      copy:
        src: "../{{ item }}"
        dest: /home/ec2-user/terraform-project/
        owner: ec2-user
        group: ec2-user
      loop:
        - docker-compose.yml
        - api
        - website
        - default.conf

    - name: Install Docker and Compose
      shell: |
        dnf install -y docker
        systemctl start docker
        systemctl enable docker
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
      register: install_result
      # This 'register' stores the exit code and output in a variable

    - name: Show exit code of installation for debugging
      debug:
        msg: "The installation finished with exit code {{ install_result.rc }}"
        # In Ansible, .rc is the same as 'echo $?'

    - name: Force remove any conflicting containers
      shell: "docker rm -f backend frontend || true"

    - name: Deploy fresh containers
      community.docker.docker_compose_v2:
        project_src: /home/ec2-user/terraform-project
        state: present
        build: always
        recreate: always