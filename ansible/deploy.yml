---
- name: Deploy YT Thumbnail App with Monitoring
  hosts: all
  become: yes
  tasks:
    - name: Ensure project directory exists on EC2
      file:
        path: /home/ec2-user/terraform-project
        state: directory
        owner: ec2-user
        group: ec2-user

    # --- S3 BOOTSTRAP ---
    - name: Install python3-pip using dnf
      dnf:
        name: python3-pip
        state: present

    - name: Install S3 dependencies (boto3) on EC2
      ansible.builtin.pip:
        name: [boto3, botocore]
        executable: pip3

    # --- S3 RESTORE ---
    - name: Check if monitoring state exists in S3
      amazon.aws.s3_object:
        bucket: monitoring-configs-and-stats-kali
        object: monitoring_state.tar.gz
        mode: geturl
      register: s3_check
      ignore_errors: yes

    - name: Download and Extract State from S3
      block:
        - name: Download state from S3 vault
          amazon.aws.s3_object:
            bucket: monitoring-configs-and-stats-kali
            object: monitoring_state.tar.gz
            dest: /home/ec2-user/terraform-project/monitoring_state.tar.gz
            mode: get

        - name: Extract monitoring state
          ansible.builtin.unarchive:
            src: /home/ec2-user/terraform-project/monitoring_state.tar.gz
            dest: /home/ec2-user/terraform-project/
            remote_src: yes
            owner: ec2-user
            group: ec2-user
      when: s3_check is succeeded

    # --- THE PERMANENT FIX: PERMISSION GUARD ---
    - name: Force Grafana ownership and permissions (User 472)
      file:
        path: /home/ec2-user/terraform-project/data/grafana
        state: directory
        owner: '472'
        group: '472'
        mode: '0775'
        recurse: yes

    - name: Force Prometheus ownership and permissions (User 65534)
      file:
        path: /home/ec2-user/terraform-project/data/prometheus
        state: directory
        owner: '65534'
        group: '65534'
        mode: '0775'
        recurse: yes

    # --- REST OF DEPLOYMENT ---
    - name: Copy project files to EC2
      copy:
        src: "../{{ item }}"
        dest: /home/ec2-user/terraform-project/
        owner: ec2-user
        group: ec2-user
      loop: [docker-compose.yml, api, website, default.conf, prometheus.yml]

    - name: Clean DNF cache
      command: dnf clean all

    - name: Install Docker Engine
      dnf: { name: docker, state: present }

    - name: Ensure Docker Service is started
      systemd: { name: docker, state: started, enabled: yes }

    - name: Deploy fresh containers
      community.docker.docker_compose_v2:
        project_src: /home/ec2-user/terraform-project
        state: present
        build: always
        recreate: always