---
- name: Deploy YT Thumbnail App with Monitoring
  hosts: all
  become: yes
  gather_facts: false

  vars:
    ansible_ssh_pipelining: true
    ansible_host_key_checking: false
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_ssh_extra_args: "-o ControlMaster=auto -o ControlPersist=120s"
    ansible_scp_if_ssh: false

  tasks:
    - name: Ensure project base directory structure exists
      file:
        path: "{{ item }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
      loop:
        - /home/ec2-user/terraform-project

    # --- AUTOMATIC SYSTEM ENVIRONMENT REPAIR ---
    - name: Verify baseline system operational dependencies
      ansible.builtin.dnf:
        name:
          - cronie
          - python3-pip
        state: present

    - name: Ensure cron service infrastructure is running
      ansible.builtin.systemd:
        name: crond
        state: started
        enabled: yes

    - name: Check if S3 Python bindings are natively operational
      ansible.builtin.command: python3 -c "import boto3, botocore"
      register: boto_check
      changed_when: false
      failed_when: false

    - name: Force inject Python cloud dependencies if missing
      ansible.builtin.pip:
        name: [boto3, botocore]
        executable: pip3
      when: boto_check.rc != 0

    # --- NATIVE S3 RESTORATION ---
    - name: Download latest master state snapshot from S3 vault
      amazon.aws.s3_object:
        bucket: monitoring-configs-and-stats-kali
        object: monitoring_state.tar.gz
        dest: /tmp/monitoring_state.tar.gz
        mode: get
      ignore_errors: yes
      register: s3_download

    - name: Extract monitoring state onto host path
      ansible.builtin.unarchive:
        src: /tmp/monitoring_state.tar.gz
        dest: /home/ec2-user/terraform-project/
        remote_src: yes
        owner: ec2-user
        group: ec2-user
      when: s3_download is succeeded

    - name: Clean up temporary download artifacts
      file:
        path: /tmp/monitoring_state.tar.gz
        state: absent
      when: s3_download is succeeded

    # --- CONFIGURATION LINKING ---
    - name: Copy project runtime configuration blueprints to EC2
      copy:
        src: "../{{ item }}"
        dest: /home/ec2-user/terraform-project/
        owner: ec2-user
        group: ec2-user
      loop: [docker-compose.yml, api, website, default.conf, prometheus.yml]

    # --- AUTOMATED BACKUP CRON JOB ---
    - name: Create the persistent structural backup script on EC2
      copy:
        dest: /home/ec2-user/backup_monitoring.sh
        mode: '0755'
        owner: ec2-user
        group: ec2-user
        content: |
          #!/bin/bash
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M)
          BUCKET="monitoring-configs-and-stats-kali"
          
          # Cleanly backup Docker volumes directly from the source engine data paths
          sudo tar -czf /tmp/monitoring_state.tar.gz -C /var/lib/docker/volumes/ ./prometheus_data ./grafana_data
          
          aws s3 cp /tmp/monitoring_state.tar.gz s3://$BUCKET/monitoring_state.tar.gz
          aws s3 cp /tmp/monitoring_state.tar.gz s3://$BUCKET/backups/monitoring_state_$TIMESTAMP.tar.gz
          sudo rm -f /tmp/monitoring_state.tar.gz

    - name: Schedule the Backup Cron Job (Every night at 3 AM)
      ansible.builtin.cron:
        name: "Nightly Monitoring Backup"
        minute: "0"
        hour: "3"
        user: ec2-user
        job: "/home/ec2-user/backup_monitoring.sh > /dev/null 2>&1"

    # --- DETERMINISTIC CONTAINER ORCHESTRATION ---
    - name: Terminate conflicting containers to avoid routing state collisions
      shell: "docker rm -f backend frontend prometheus grafana || true"

    - name: Deploy fresh service containers via Standalone Compose Engine
      shell: "/usr/bin/docker-compose up -d --build --force-recreate"
      args:
        chdir: /home/ec2-user/terraform-project
      environment:
        DOCKER_BUILDKIT: "0"
        COMPOSE_DOCKER_CLI_BUILD: "0"