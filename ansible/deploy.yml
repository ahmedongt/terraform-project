---
- name: Deploy YT Thumbnail App with Monitoring
  hosts: all
  become: yes
  tasks:
    - name: Ensure project base directory structure exists
      file:
        path: "{{ item }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
      loop:
        - /home/ec2-user/terraform-project
        - /home/ec2-user/terraform-project/data
        - /home/ec2-user/terraform-project/data/grafana
        - /home/ec2-user/terraform-project/data/prometheus

    # --- SYSTEM PACKAGE INSTALLS ---
    - name: Ensure python3-pip is installed on target host
      ansible.builtin.dnf:
        name: python3-pip
        state: present

    # --- PIP MODULE READY FOR S3 EXTENSIONS ---
    # Python3-pip package installation handled above to ensure global binary paths resolve cleanly
    - name: Install S3 interaction dependencies (boto3) via pip
      ansible.builtin.pip:
        name: [boto3, botocore]
        executable: pip3

    # --- NATIVE S3 RESTORATION ---
    - name: Download latest master state snapshot from S3 vault
      amazon.aws.s3_object:
        bucket: monitoring-configs-and-stats-kali
        object: monitoring_state.tar.gz
        dest: /tmp/monitoring_state.tar.gz
        mode: get
      ignore_errors: yes
      register: s3_download

    - name: Extract monitoring state onto host path
      ansible.builtin.unarchive:
        src: /tmp/monitoring_state.tar.gz
        dest: /home/ec2-user/terraform-project/
        remote_src: yes
        owner: ec2-user
        group: ec2-user
      when: s3_download is succeeded

    - name: Clean up temporary download artifacts
      file:
        path: /tmp/monitoring_state.tar.gz
        state: absent
      when: s3_download is succeeded

    # --- PERMISSION GUARD ---
    - name: Force Grafana ownership and permissions (User 472)
      file:
        path: /home/ec2-user/terraform-project/data/grafana
        state: directory
        owner: '472'
        group: '472'
        mode: '0775'
        recurse: yes

    - name: Force Prometheus ownership and permissions (User 65534)
      file:
        path: /home/ec2-user/terraform-project/data/prometheus
        state: directory
        owner: '65534'
        group: '65534'
        mode: '0775'
        recurse: yes

    # --- CONFIGURATION LINKING ---
    - name: Copy project runtime configuration blueprints to EC2
      copy:
        src: "../{{ item }}"
        dest: /home/ec2-user/terraform-project/
        owner: ec2-user
        group: ec2-user
      loop: [docker-compose.yml, api, website, default.conf, prometheus.yml]

    # --- AUTOMATED BACKUP CRON JOB ---
    - name: Create the persistent structural backup script on EC2
      copy:
        dest: /home/ec2-user/backup_monitoring.sh
        mode: '0755'
        owner: ec2-user
        group: ec2-user
        content: |
          #!/bin/bash
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M)
          PROJECT_DIR="/home/ec2-user/terraform-project"
          BUCKET="monitoring-configs-and-stats-kali"
          
          # Package data files using elevated path access
          sudo tar -czf /tmp/monitoring_state.tar.gz -C $PROJECT_DIR ./data/
          
          # Maintain master state pointer for rapid pipeline recovery
          aws s3 cp /tmp/monitoring_state.tar.gz s3://$BUCKET/monitoring_state.tar.gz
          
          # Retain long-term 30-day historical ledger traces
          aws s3 cp /tmp/monitoring_state.tar.gz s3://$BUCKET/backups/monitoring_state_$TIMESTAMP.tar.gz
          
          # Cleanup working artifacts safely
          sudo rm -f /tmp/monitoring_state.tar.gz

    - name: Schedule the Backup Cron Job (Every night at 3 AM)
      ansible.builtin.cron:
        name: "Nightly Monitoring Backup"
        minute: "0"
        hour: "3"
        user: ec2-user
        job: "/home/ec2-user/backup_monitoring.sh > /dev/null 2>&1"

    # --- DETERMINISTIC CONTAINER ORCHESTRATION ---
    - name: Terminate conflicting containers to avoid routing state collisions
      shell: "docker rm -f backend frontend prometheus grafana || true"

    - name: Deploy fresh service containers
      community.docker.docker_compose_v2:
        project_src: /home/ec2-user/terraform-project
        state: present
        build: always
        recreate: always