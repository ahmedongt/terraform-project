---
- name: Deploy YT Thumbnail App with Stateless Monitoring
  hosts: all
  become: yes
  gather_facts: false

  vars:
    ansible_ssh_pipelining: true
    ansible_host_key_checking: false
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ansible_ssh_extra_args: "-o ControlMaster=auto -o ControlPersist=120s"
    ansible_scp_if_ssh: false

  tasks:
    - name: Ensure project base directory structure exists
      file:
        path: /home/ec2-user/terraform-project
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copy stateless project code and configurations to EC2
      copy:
        src: "../{{ item }}"
        dest: /home/ec2-user/terraform-project/
        owner: ec2-user
        group: ec2-user
      loop: 
        - docker-compose.yml
        - default.conf
        - prometheus.yml
        - api
        - website
        - grafana

    - name: Purge any conflicting container configurations cleanly
      shell: "docker rm -f backend frontend node-exporter prometheus grafana || true"

    - name: Declarative deployment via Docker Compose
      shell: "/usr/bin/docker-compose up -d --build --force-recreate"
      args:
        chdir: /home/ec2-user/terraform-project
      environment:
        DOCKER_BUILDKIT: "0"
        COMPOSE_DOCKER_CLI_BUILD: "0"