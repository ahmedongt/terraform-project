---
- name: Deploy YT Thumbnail App
  hosts: all
  become: yes
  tasks:
    - name: Ensure project directory exists on EC2
      file:
        path: /home/ec2-user/terraform-project
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Copy project files to EC2
      copy:
        src: "../{{ item }}"
        dest: /home/ec2-user/terraform-project/
        owner: ec2-user
        group: ec2-user
      loop:
        - docker-compose.yml
        - api
        - website
        - default.conf

    - name: Install Docker, Compose, and Buildx
      shell: |
        dnf install -y docker
        systemctl start docker
        systemctl enable docker
        
        # 1. Install Docker Compose
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
        
        # 2. Install Docker Buildx (Required for Compose Build)
        curl -SL https://github.com/docker/buildx/releases/latest/download/buildx-v0.17.1.linux-amd64 -o /usr/local/lib/docker/cli-plugins/docker-buildx
        chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
      register: install_result

    - name: Show exit code of installation
      debug:
        msg: "The installation finished with exit code {{ install_result.rc }}"

    - name: Force remove any conflicting containers
      shell: "docker rm -f backend frontend || true"

    - name: Deploy fresh containers
      community.docker.docker_compose_v2:
        project_src: /home/ec2-user/terraform-project
        state: present
        build: always
        recreate: always