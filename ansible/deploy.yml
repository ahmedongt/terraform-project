---
- name: Deploy YT Thumbnail App
  hosts: all
  become: yes
  tasks:
    - name: Ensure project directory exists on EC2
      file:
        path: /home/ec2-user/terraform-project
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Copy project files to EC2
      copy:
        src: "../{{ item }}"
        dest: /home/ec2-user/terraform-project/
        owner: ec2-user
        group: ec2-user
      loop:
        - docker-compose.yml
        - api
        - website
        - default.conf

    - name: Install Docker Engine
      dnf:
        name: docker
        state: present

    - name: Ensure Docker Service is started
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker Compose and Buildx Binaries
      shell: |
        # Use Ansible variables to determine architecture
        ARCH="{{ ansible_architecture }}"
        if [ "$ARCH" = "x86_64" ]; then 
          COMPOSE_URL="https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
          BUILDX_URL="https://github.com/docker/buildx/releases/latest/download/buildx-v0.17.1.linux-amd64"
        else
          COMPOSE_URL="https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64"
          BUILDX_URL="https://github.com/docker/buildx/releases/latest/download/buildx-v0.17.1.linux-arm64"
        fi

        mkdir -p /usr/local/lib/docker/cli-plugins
        
        # Download and force overwrite to ensure no corrupted files remain
        curl -SL "$COMPOSE_URL" -o /usr/local/lib/docker/cli-plugins/docker-compose
        curl -SL "$BUILDX_URL" -o /usr/local/lib/docker/cli-plugins/docker-buildx
        
        # Set permissions
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
      register: bin_install

    - name: Force remove any conflicting containers
      shell: "docker rm -f backend frontend || true"

    - name: Deploy fresh containers
      community.docker.docker_compose_v2:
        project_src: /home/ec2-user/terraform-project
        state: present
        build: always
        recreate: always