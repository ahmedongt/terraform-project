<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YT Thumbnail Downloader</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-2xl w-full max-w-md text-center border border-gray-700">
        <h1 class="text-3xl font-bold text-red-500 mb-6">YT Thumbnail Downloader</h1>
        <input type="text" id="videoUrl" placeholder="Paste YouTube Link..." class="w-full p-4 rounded-xl bg-gray-900 border border-gray-700 mb-4">
        <button onclick="downloadThumbnail()" id="btn" class="w-full bg-red-600 py-4 rounded-xl font-bold">Get Thumbnail</button>
        <p id="status" class="mt-4 text-gray-400"></p>
        <div id="resultArea" class="mt-8 hidden">
            <img id="thumbPreview" class="w-full rounded-xl mb-6">
            <button id="viewFullBtn" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-semibold mb-2 transition">View Full Size</button>
            <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-lg font-semibold mb-4 transition">Save to Device</button>
            <button id="deleteBtn" class="w-full text-gray-500 hover:text-red-400 text-sm">Wipe from AWS Server</button>
        </div>
    </div>
    <script>
        async function downloadThumbnail() {
            const urlInput = document.getElementById('videoUrl');
            const url = urlInput.value;
            if (!url) {
                document.getElementById('status').innerText = "Please paste a link first!";
                return;
            }
            
            document.getElementById('status').innerText = "Processing...";
            const res = await fetch(`/api/get-thumb?url=${encodeURIComponent(url)}`);
            const data = await res.json();
            
            if (data.url) {
                document.getElementById('resultArea').classList.remove('hidden');
                document.getElementById('status').innerText = "Thumbnail Ready!";
                
                // Set the preview image src
                document.getElementById('thumbPreview').src = data.url;
                
                // Parse filename out of the secure URL
                const urlObj = new URL(data.url);
                const filename = urlObj.pathname.split('/').pop();
                
                // 1. View Full Size Button: Opens the image link cleanly in a new tab
                document.getElementById('viewFullBtn').onclick = () => {
                    window.open(data.url, '_blank');
                };
                
                // 2. Save to Device Button: Fetches file as a blob to trigger a true local download
                document.getElementById('downloadBtn').onclick = async () => {
                    try {
                        const response = await fetch(data.url);
                        const blob = await response.blob();
                        const blobUrl = window.URL.createObjectURL(blob);
                        const downloadLink = document.createElement('a');
                        downloadLink.href = blobUrl;
                        downloadLink.download = filename || 'thumbnail.jpg';
                        document.body.appendChild(downloadLink);
                        downloadLink.click();
                        document.body.removeChild(downloadLink);
                        window.URL.revokeObjectURL(blobUrl);
                    } catch (err) {
                        // Fallback option if local download fails
                        window.open(data.url, '_blank');
                    }
                };
                
                // 3. Wipe from AWS Server Button: Wipes file from S3 and resets input box
                document.getElementById('deleteBtn').onclick = async () => {
                    await fetch(`/api/delete?file=${filename}`);
                    document.getElementById('resultArea').classList.add('hidden');
                    document.getElementById('status').innerText = "Deleted from AWS!";
                    urlInput.value = ''; // Auto-clears the link field
                };
            } else {
                document.getElementById('status').innerText = "Error: " + (data.error || "Failed");
            }
        }
    </script>
</body>
</html>
