<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Thumbnail Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/ajax/libs/font-awesome.min.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4 font-sans">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border border-gray-700">
        <h1 class="text-3xl font-extrabold mb-2 text-red-500 tracking-tight">YT Thumbnail Downloader</h1>
        <p class="text-gray-400 text-sm mb-8 flex items-center justify-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            Fast and Secure Server. 
        </p>

        <div class="space-y-4">
            <input type="text" id="videoUrl" placeholder="Paste YouTube Link here..."
                class="w-full p-4 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500 text-white transition-all shadow-inner">

            <button onclick="downloadThumbnail()" id="btn"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition duration-300 transform active:scale-95 shadow-lg flex items-center justify-center gap-2">
                <i class="fas fa-magic"></i> Get Thumbnail
            </button>
        </div>

        <p id="status" class="mt-4 text-sm font-medium text-gray-400 min-h-[1.25rem]"></p>

        <div id="resultArea" class="mt-8 hidden border-t border-gray-700 pt-6 animate-fade-in">
            <div class="relative group">
                <img id="thumbPreview" class="w-full rounded-xl shadow-md mb-6 border border-gray-600 transition-transform group-hover:scale-[1.02]">
            </div>

            <div class="grid grid-cols-1 gap-3">
                <a id="viewBtn" target="_blank"
                   class="bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg font-semibold transition flex items-center justify-center gap-2">
                   <i class="fas fa-eye"></i> View Full Size
                </a>

                <button id="downloadBtn"
                   class="bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded-lg font-semibold transition flex items-center justify-center gap-2">
                   <i class="fas fa-download"></i> Save to Device
                </button>

                <button id="deleteBtn"
                   class="mt-4 text-gray-500 hover:text-red-400 text-xs transition flex items-center justify-center gap-2">
                   <i class="fas fa-trash-alt"></i> Wipe from AWS Server
                </button>
            </div>
        </div>
    </div>

    <script>
        /* CRITICAL FIX: Using an empty string for API_BASE makes the app "Location Independent".
           It will talk to the AWS IP if you visit the IP, or the Domain if you visit the Domain.
        */
        const API_BASE = ""; 

        async function downloadThumbnail() {
            const urlInput = document.getElementById('videoUrl').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btn');
            const resultArea = document.getElementById('resultArea');

            if (!urlInput) {
                status.innerHTML = "<span class='text-yellow-500'>⚠️ Please paste a URL first!</span>";
                return;
            }

            status.innerHTML = "<i class='fas fa-spinner fa-spin mr-2'></i> Processing on AWS...";
            btn.disabled = true;
            resultArea.classList.add('hidden');

            try {
                // Using relative path for the API call
                const response = await fetch(`${API_BASE}/get-thumb?url=${encodeURIComponent(urlInput)}`);
                
                if (!response.ok) {
                    throw new Error(`Server Error: ${response.status}. Please check your Flask API.`);
                }

                const contentType = response.headers.get("content-type");

                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);
                    setupUI(data);
                } else {
                    const blob = await response.blob();
                    const blobUrl = window.URL.createObjectURL(blob);
                    setupUI({ view_url: blobUrl, filename: "thumbnail.jpg", is_direct_blob: true });
                }

            } catch (error) {
                status.innerHTML = "<span class='text-red-500'>❌ " + error.message + "</span>";
                console.error("Fetch Error:", error);
            } finally {
                btn.disabled = false;
            }
        }

        function setupUI(data) {
            const status = document.getElementById('status');
            const resultArea = document.getElementById('resultArea');
            // Logic to handle relative URLs returned by Flask
            const fullImageUrl = data.is_direct_blob ? data.view_url : `${API_BASE}${data.view_url}`;

            document.getElementById('thumbPreview').src = fullImageUrl;
            document.getElementById('viewBtn').href = fullImageUrl;

            document.getElementById('downloadBtn').onclick = async () => {
                status.innerHTML = "<i class='fas fa-cog fa-spin mr-2'></i> Saving to device...";
                try {
                    const imgRes = await fetch(fullImageUrl);
                    const blob = await imgRes.blob();
                    const blobUrl = window.URL.createObjectURL(blob);

                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = data.filename || "thumbnail.jpg";
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(blobUrl);
                    status.innerHTML = "<span class='text-green-400'>✅ Downloaded!</span>";
                } catch (e) {
                    status.innerHTML = "<span class='text-red-500'>❌ Download failed.</span>";
                }
            };

            document.getElementById('deleteBtn').onclick = async () => {
                if (data.is_direct_blob) {
                    resultArea.classList.add('hidden');
                    status.innerText = "✨ Cleaned!";
                    return;
                }
                status.innerText = "🗑️ Wiping server...";
                try {
                    const delRes = await fetch(`${API_BASE}${data.delete_url}`);
                    if (delRes.ok) {
                        resultArea.classList.add('hidden');
                        status.innerHTML = "<span class='text-green-400'>✨ Server cleaned!</span>";
                        document.getElementById('videoUrl').value = "";
                    }
                } catch (e) {
                    status.innerHTML = "<span class='text-red-500'>❌ Delete failed.</span>";
                }
            };

            resultArea.classList.remove('hidden');
            status.innerHTML = "<span class='text-green-400'>✅ Success!</span>";
        }
    </script>

    <style>
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
